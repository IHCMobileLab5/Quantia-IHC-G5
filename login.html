<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quantia — Iniciar sesión</title>

    <link rel="stylesheet" href="src/public/assets/styles/login.css" />
    <link rel="icon" href="src/public/favicon.ico" />
</head>

<body>
<img
        class="coin-deco"
        src="src/public/assets/images/moneda.png"
        alt=""
        aria-hidden="true"
        draggable="false"
/>

<main class="login-layout">
    <section class="auth-card" aria-labelledby="titulo-login">
        <h1 id="titulo-login" class="auth-title">Iniciar sesión</h1>

        <form class="auth-form" id="loginForm" novalidate>
            <label class="field">
                <span class="label">Correo electrónico</span>
                <input
                        type="email"
                        name="email"
                        inputmode="email"
                        autocomplete="email"
                        placeholder="usuario@gmail.com"
                        required
                />
            </label>

            <label class="field">
                <span class="label">Contraseña</span>
                <input
                        type="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required
                />
            </label>

            <div class="form-row form-row--sm">
                <label class="checkbox">
                    <input type="checkbox" name="remember" />
                    <span>Recordar contraseña</span>
                </label>

                <a class="link" href="config.html">Restablecer contraseña</a>
            </div>

            <button class="btn btn-primary" type="submit">Iniciar sesión</button>

            <div class="divider"><span>o</span></div>

            <a class="btn btn-outline" href="register.html">Registrarse</a>

            <p class="helper">continuar con Google</p>

            <div class="actions-row">
                <button type="button" class="chip chip-accent">Activar 2FA</button>
                <button type="button" class="chip chip-muted">Cerrar sesión en todos los dispositivos</button>
            </div>
        </form>
    </section>

    <aside class="brand-card" aria-hidden="true">
        <div class="brand-card__inner">
            <img
                    src="src/public/assets/images/logo.png"
                    class="brand-logo"
                    alt="Logo de Quantia"
                    draggable="false"
            />
        </div>
    </aside>
</main>

<!-- Toast pro (1 solo) -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
    <div class="toast__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="toast__svg">
            <!-- success -->
            <g class="i-success">
                <path d="M20 7 10.5 16.5 4 10" fill="none" stroke="currentColor" stroke-width="2.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <!-- error -->
            <g class="i-error">
                <path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.5"
                      stroke-linecap="round"/>
            </g>
        </svg>
    </div>

    <div class="toast__content">
        <div class="toast__title" id="toastTitle">Listo</div>
        <div class="toast__msg" id="toastMsg">Mensaje</div>
    </div>

    <button class="toast__close" id="toastClose" type="button" aria-label="Cerrar">×</button>
</div>

<script src="src/public/assets/scripts/login.js" defer></script>
</body>
</html>
