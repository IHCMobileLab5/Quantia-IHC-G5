<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quantia — Iniciar sesión</title>

    <link rel="stylesheet" href="src/public/assets/styles/login.css" />
    <link rel="icon" href="src/public/favicon.ico" />
</head>

<body>
<img
        class="coin-deco"
        src="src/public/assets/images/moneda.png"
        alt=""
        aria-hidden="true"
        draggable="false"
/>

<main class="login-layout">
    <section class="auth-card" aria-labelledby="titulo-login">
        <h1 id="titulo-login" class="auth-title">Iniciar sesión</h1>

        <form id="loginForm" class="auth-form" novalidate>
            <label class="field">
                <span class="label">Correo electrónico</span>
                <input
                        type="email"
                        name="email"
                        inputmode="email"
                        autocomplete="email"
                        placeholder="tu.correo@dominio.com"
                        required
                />
            </label>

            <label class="field">
                <span class="label">Contraseña</span>
                <input
                        type="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required
                />
            </label>

            <div class="form-row form-row--sm">
                <label class="checkbox">
                    <input type="checkbox" name="remember" />
                    <span>Recordar contraseña</span>
                </label>

                <a class="link" href="config.html">Restablecer contraseña</a>
            </div>

            <button id="loginSubmit" class="btn btn-primary" type="submit">Iniciar sesión</button>

            <div class="divider"><span>o</span></div>

            <a class="btn btn-outline" href="register.html">Registrarse</a>

            <p class="helper">continuar con Google</p>

            <div class="actions-row">
                <button type="button" class="chip chip-accent">Activar 2FA</button>
                <button type="button" class="chip chip-muted">Cerrar sesión en todos los dispositivos</button>
            </div>
        </form>

    </section>

    <aside class="brand-card" aria-hidden="true">
        <div class="brand-card__inner">
            <img
                    src="src/public/assets/images/logo.png"
                    class="brand-logo"
                    alt="Logo de Quantia"
                    draggable="false"
            />
        </div>
    </aside>
</main>

<div id="toast" class="toast" data-type="success" hidden role="status" aria-live="polite">
    <div class="toast__icon" aria-hidden="true">
        <svg class="toast__svg i-success" viewBox="0 0 24 24" fill="none">
            <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <svg class="toast__svg i-error" viewBox="0 0 24 24" fill="none">
            <path d="M12 9v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <path d="M12 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <path d="M10.29 3.86l-7.4 12.81A2 2 0 0 0 4.62 20h14.76a2 2 0 0 0 1.73-3.33l-7.4-12.81a2 2 0 0 0-3.42 0z"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
    </div>

    <div class="toast__content">
        <div id="toastTitle" class="toast__title">Listo</div>
        <div id="toastMsg" class="toast__msg"></div>
    </div>

    <button id="toastClose" class="toast__close" type="button" aria-label="Cerrar">×</button>
</div>

<script src="src/public/assets/scripts/login.js" defer></script>
</body>
</html>
