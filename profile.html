<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantia — Perfil</title>
    <link rel="stylesheet" href="src/public/assets/styles/profile.css" />
</head>

<body>
<img src="src/public/assets/images/img.png" alt="" class="sun-decoration" aria-hidden="true" />

<div class="container">
    <header class="header">
        <button class="back" id="backBtn" type="button" aria-label="Atrás">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <h1>PERFIL</h1>
    </header>

    <!-- Sugerencia si no hay teléfono -->
    <div class="callout" id="phoneCallout" hidden>
        <div class="callout__title">Te falta tu número</div>
        <div class="callout__msg">
            Agrega un teléfono para mejorar la seguridad y la recuperación de cuenta.
        </div>
        <button class="callout__btn" id="addPhoneBtn" type="button">Agregar ahora</button>
    </div>

    <main class="content">
        <aside class="left">
            <div class="avatarWrap">
                <img src="src/public/assets/images/avatar.png" class="avatar" alt="Avatar" />
            </div>
            <div class="badge" id="verificationBadge">VERIFICACIÓN: —</div>
        </aside>

        <section class="right">
            <form id="profileForm" class="form" novalidate>
                <div class="row">
                    <label class="field">
                        <span class="field__label">Nombre</span>
                        <input type="text" id="nombre" name="nombre" autocomplete="given-name" />
                        <small class="field__error" id="nombreError"></small>
                    </label>

                    <label class="field">
                        <span class="field__label">Apellido</span>
                        <input type="text" id="apellido" name="apellido" autocomplete="family-name" />
                        <small class="field__error" id="apellidoError"></small>
                    </label>
                </div>

                <div class="row">
                    <label class="field">
                        <span class="field__label">Teléfono</span>
                        <input type="tel" id="telefono" name="telefono" inputmode="tel" placeholder="Ej: 999888777" />
                        <small class="field__error" id="telefonoError"></small>
                    </label>

                    <label class="field">
                        <span class="field__label">DNI</span>
                        <input type="text" id="dni" name="dni" inputmode="numeric" placeholder="Ej: 12345678" />
                        <small class="field__error" id="dniError"></small>
                    </label>
                </div>

                <div class="row">
                    <label class="field field--full">
                        <span class="field__label">Email</span>
                        <input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="usuario@gmail.com" />
                        <small class="field__error" id="emailError"></small>
                    </label>
                </div>

                <div class="actions">
                    <button class="btn btn--ghost" id="logoutBtn" type="button">Cerrar sesión</button>
                    <button class="btn" id="editBtn" type="button">Editar</button>
                    <button class="btn btn--primary" id="saveBtn" type="submit" hidden>Guardar cambios</button>
                </div>
            </form>
        </section>
    </main>

    <div class="buttons-row">
        <button class="kyc" id="kycBtn" type="button">Verificar KYC</button>
        <button class="plus" id="plusBtn" type="button" aria-label="Acción rápida">+</button>
    </div>
</div>

<div class="modal" id="confirmModal" hidden aria-hidden="true">
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" tabindex="-1">
        <h2 class="modal__title" id="confirmTitle">Confirma tu contraseña</h2>
        <p class="modal__subtitle">
            Para cambiar teléfono o correo, reingresa tu contraseña actual.
        </p>

        <label class="modal__field">
            <span>Contraseña actual</span>
            <input type="password" id="confirmPassword" autocomplete="current-password" placeholder="••••••••" />
            <small class="field__error" id="confirmPasswordError"></small>
        </label>

        <div class="modal__actions">
            <button class="btn btn--ghost" id="cancelConfirmBtn" type="button">Cancelar</button>
            <button class="btn btn--primary" id="confirmSaveBtn" type="button">Confirmar y guardar</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden>
    <div class="toast__icon" id="toastIcon" aria-hidden="true"></div>
    <div class="toast__content">
        <div class="toast__title" id="toastTitle">Listo</div>
        <div class="toast__msg" id="toastMsg">Mensaje</div>
    </div>
    <button class="toast__close" id="toastClose" type="button" aria-label="Cerrar">✕</button>
</div>

<script src="src/public/assets/scripts/profile.js" defer></script>
</body>
</html>
