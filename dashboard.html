<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quantia — Dashboard</title>
    <link rel="stylesheet" href="src/public/assets/styles/dashboard.css" />
</head>

<body class="dash">
<header class="topbar">
    <button class="back" id="backBtn" type="button" aria-label="Atrás">
        <span class="back__icon">‹</span>
        <span class="back__text">ATRÁS</span>
    </button>

    <nav class="nav" aria-label="Navegación principal">
        <button class="nav__btn is-active" type="button" data-href="dashboard.html">Inicio</button>
        <button class="nav__btn" type="button" data-href="portfolio-performance.html">Portafolio</button>
        <button class="nav__btn" type="button" data-href="market.html">Mercados</button>
        <button class="nav__btn" type="button" data-href="transfer.html">Transferencia</button>
        <button class="nav__btn" type="button" data-href="contact.html">Contacto</button>
        <button class="nav__lang" id="langBtn" type="button">ES/EN</button>
    </nav>

    <div class="topbar__right">
        <button class="iconBtn" id="alertBtn" type="button" aria-label="Alertas" title="Alertas">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3 1.8 20.5A1.2 1.2 0 0 0 2.84 22h18.32a1.2 1.2 0 0 0 1.04-1.5L12 3Z"></path>
                <path d="M12 9v5"></path>
                <path d="M12 17h.01"></path>
            </svg>
        </button>

        <button class="themeToggle" id="themeBtn" type="button" aria-label="Cambiar tema" aria-pressed="false" title="Tema">
      <span class="themeToggle__track">
        <span class="themeToggle__sun">☀</span>
        <span class="themeToggle__moon">☾</span>
        <span class="themeToggle__thumb" aria-hidden="true"></span>
      </span>
        </button>

        <button class="iconBtn iconBtn--menu" id="menuBtn" type="button" aria-label="Menú" title="Menú">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 18h16"></path>
            </svg>
        </button>
    </div>
</header>

<div class="drawerBackdrop" id="drawerBackdrop" aria-hidden="true"></div>

<aside class="drawer" id="drawer" aria-label="Menú móvil">
    <div class="drawer__top">
        <img class="drawer__logo" src="src/public/assets/images/logo.png" alt="Quantia" draggable="false" />
        <button class="drawer__close" id="drawerCloseBtn" type="button" aria-label="Cerrar">✕</button>
    </div>

    <div class="drawer__nav">
        <button class="drawer__btn is-active" type="button" data-href="dashboard.html">Inicio</button>
        <button class="drawer__btn" type="button" data-href="portfolio-performance.html">Portafolio</button>
        <button class="drawer__btn" type="button" data-href="market.html">Mercados</button>
        <button class="drawer__btn" type="button" data-href="transfer.html">Transferencia</button>
        <button class="drawer__btn" type="button" data-href="contact.html">Contacto</button>
    </div>

    <div class="drawer__bottom">
        <button class="drawer__lang" id="drawerLangBtn" type="button">ES/EN</button>
    </div>
</aside>

<main class="hero">
    <section class="hero__copy">
        <h1>Bienvenido <span id="userName">Usuario</span></h1>
        <p>Gestiona tu portafolio, revisa mercados y realiza transferencias de forma rápida y segura, con una vista clara de tu rendimiento.</p>
        <p>Accede a tus activos, monitorea variaciones y recibe alertas para tomar decisiones informadas.</p>
    </section>

    <section class="hero__brand" aria-label="Marca">
        <img class="hero__logo" src="src/public/assets/images/logo.png" alt="Quantia" draggable="false" />
    </section>
</main>

<button class="fab fab--chat" type="button" aria-label="Chat" title="Chat">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="b1" d="M21 14a4 4 0 0 1-4 4H8l-5 3V6a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z"></path>
        <circle class="b2" cx="16.5" cy="15.5" r="3.2"></circle>
    </svg>
</button>

<button class="fab fab--help" type="button" aria-label="Ayuda" title="Ayuda">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 18h.01"></path>
        <path d="M9.5 9a2.5 2.5 0 1 1 4.2 1.8c-.7.6-1.2 1-1.2 2.2"></path>
        <path d="M12 22a10 10 0 1 0-10-10 10 10 0 0 0 10 10Z"></path>
    </svg>
</button>

<script src="src/public/assets/scripts/dashboard.js"></script>
</body>
</html>
