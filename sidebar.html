<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantia</title>
    <link rel="stylesheet" href="src/public/assets/styles/sidebar.css" />
</head>

<body class="app-shell">

<img class="bg" src="src/public/assets/images/fondo3.png" alt="" aria-hidden="true" draggable="false" />


<header class="topbar">
    <button class="topbar__back" id="backBtn" type="button" aria-label="Atrás">
        <span class="topbar__backIcon">‹</span>
        <span class="topbar__backText">ATRAS</span>
    </button>

    <div class="topbar__right">
        <button class="iconBtn" id="alertBtn" type="button" aria-label="Alertas" title="Alertas">
            <!-- warning -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3 1.8 20.5A1.2 1.2 0 0 0 2.84 22h18.32a1.2 1.2 0 0 0 1.04-1.5L12 3Z"></path>
                <path d="M12 9v5"></path>
                <path d="M12 17h.01"></path>
            </svg>
        </button>

        <button class="themeToggle" id="themeBtn" type="button" aria-label="Cambiar tema" title="Modo oscuro">
        <span class="themeToggle__track">
          <span class="themeToggle__sun">☀</span>
          <span class="themeToggle__moon">☾</span>
          <span class="themeToggle__thumb" aria-hidden="true"></span>
        </span>
        </button>

        <button class="iconBtn iconBtn--menu" id="toggleBtn" type="button" aria-label="Menú" title="Menú">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 18h16"></path>
            </svg>
        </button>
    </div>
</header>


<div class="backdrop" id="backdrop" aria-hidden="true"></div>


<aside class="sidebar" id="sidebar" aria-label="Navegación">
    <img src="src/public/assets/images/logo.png" alt="Quantia" class="sidebar__logo" draggable="false" />

    <nav>
        <ul class="menu">

            <li><a data-page="active-details.html">Activos</a></li>
            <li><a data-page="profile.html">Perfil</a></li>
            <li><a data-page="config.html">Configuración</a></li>
        </ul>
    </nav>

    <button class="sidebar__signout" id="signOutBtn" type="button">Cerrar sesión</button>
</aside>


<main class="main">

    <section class="home" id="home">
        <img class="home__logo" src="src/public/assets/images/logo.png" alt="Quantia" draggable="false" />
        <div class="home__lines" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
        </div>
    </section>


    <iframe id="contentFrame" class="content-frame" src="" title="Contenido" hidden></iframe>


    <button class="fab fab--left" type="button" aria-label="Chat" title="Chat">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 14a4 4 0 0 1-4 4H8l-5 3V6a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z"></path>
        </svg>
    </button>

    <button class="fab fab--right" type="button" aria-label="Ayuda" title="Ayuda">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 18h.01"></path>
            <path d="M9.5 9a2.5 2.5 0 1 1 4.2 1.8c-.7.6-1.2 1-1.2 2.2"></path>
            <path d="M12 22a10 10 0 1 0-10-10 10 10 0 0 0 10 10Z"></path>
        </svg>
    </button>
</main>

<script src="src/public/assets/scripts/sidebar.js"></script>
</body>
</html>
